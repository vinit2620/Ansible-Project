---
- hosts: localhost
  connection: local

  tasks:
    - name: Create EC2 instances
      amazon.aws.ec2_instance:
        name: "{{ item.name }}"
        key_name: "ansible-key-pair"
        instance_type: t3.micro
        security_group: "default"
        region: ap-south-1
        access_key: "{{ ec2_access_key }}"
        secret_key: "{{ ec2_secret_key }}"
        network:
          assign_public_ip: true
        image_id: "{{ item.image }}"
      loop:
        - { name: "ansible-instance-1", image: "ami-035827357e3c7e810" }
        - { name: "ansible-instance-2", image: "ami-01a00762f46d584a1" }
        - { name: "ansible-instance-3", image: "ami-01a00762f46d584a1" }
